# Production Khatario — copy to /etc/nginx/sites-available/khatario
# Proxies to PM2 app `khatario` (Next.js HTTP on 127.0.0.1:3002).
#
# Exact names on staging / crl keep their own vhosts; they win over *.khatario.com.
# After certbot, replace this file with deploy/nginx/khatario-ssl.conf.

upstream khatario_prod {
    server 127.0.0.1:3002;
    keepalive 8;
}

map $http_upgrade $khatario_prod_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name khatario.com www.khatario.com app.khatario.com *.khatario.com;

    client_max_body_size 12M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://khatario_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $khatario_prod_connection;
        # Next binds 127.0.0.1; Location must not send browsers to localhost.
        proxy_redirect ~^https?://(127\.0\.0\.1|localhost)(:[0-9]+)?/ https://$host/;
    }
}
