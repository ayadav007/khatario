[package]
name = "khatario-desktop"
version = "0.1.0"
description = "Khatario for Windows"
authors = ["Khatario"]
edition = "2021"

[lib]
name = "khatario_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Windows printing: print spooler (RAW jobs, printer list) and the COM port list.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_System_Com"] }
windows-registry = "0.6"
# Silent A4 printing through the WebView's own print engine (same version Tauri uses).
webview2-com = "0.39"

# Small, stripped, single-unit release binary: smaller download and harder to read back.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
