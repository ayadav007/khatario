{{#each invoice.custom_meta_display}}
  <div class="detail-row custom-field-row">
    <span class="detail-label">{{this.label}}:</span>
    <span class="detail-value">{{this.value}}</span>
  </div>
{{/each}}
{{#if @root.invoice.is_post_sale_discount}}
  <div class="detail-row">
    <span class="detail-label">Supplies covered:</span>
    <span class="detail-value">{{@root.invoice.supply_period_from}} to {{@root.invoice.supply_period_to}}</span>
  </div>
{{/if}}
