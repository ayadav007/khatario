{{#if @root.invoice.irn}}<div class="kh-einvoice-irn" style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:2mm 3mm;width:100%;flex-basis:100%;grid-column:1 / -1;clear:both;box-sizing:border-box;margin-top:2mm;page-break-inside:avoid;break-inside:avoid;">{{#if @root.invoice.irn_qr_data_url}}<img src="{{@root.invoice.irn_qr_data_url}}" alt="E-invoice QR code" style="width:30mm;height:30mm;flex:0 0 30mm;max-width:none;" />{{/if}}<div style="flex:1 1 35mm;min-width:0;line-height:1.35;text-align:left;"><div style="word-break:break-all;overflow-wrap:anywhere;"><strong>IRN:</strong> {{#each @root.invoice.irn_parts}}<span>{{this}}</span>{{/each}}</div>{{#if @root.invoice.irn_ack_no}}<div><strong>Ack No:</strong> {{@root.invoice.irn_ack_no}}</div>{{/if}}{{#if @root.invoice.irn_ack_date}}<div><strong>Ack Date:</strong> {{@root.invoice.irn_ack_date}}</div>{{/if}}</div></div>{{/if}}
