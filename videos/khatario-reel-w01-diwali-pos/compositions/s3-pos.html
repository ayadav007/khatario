      <script>
        const tl = gsap.timeline({ paused: true });
        const fmt = (v) => "₹" + v.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const money = { s: 0, t: 0, g: 0 };
        const paint = () => {
          document.getElementById("s3-sub").textContent = fmt(Math.round(money.s * 100) / 100);
          document.getElementById("s3-tax").textContent = fmt(Math.round(money.t * 100) / 100);
          document.getElementById("s3-grand").textContent = fmt(Math.round(money.g * 100) / 100);
        };
        tl.fromTo("#s3-tab", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo("#s3-sub-a", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
        const steps = [
          { at: 0.7, w: "#s3-w0", r: "#s3-r0", from: [0, 0, 0], to: [450, 22.5, 472.5] },
          { at: 1.6, w: "#s3-w1", r: "#s3-r1", from: [450, 22.5, 472.5], to: [1010, 50.5, 1060.5] },
          { at: 2.5, w: "#s3-w2", r: "#s3-r2", from: [1010, 50.5, 1060.5], to: [1100, 55, 1155] },
        ];
        steps.forEach((st, i) => {
          if (i > 0) tl.set(st.w, { opacity: 1 }, st.at);
          tl.fromTo(st.w, { scale: 1 }, { scale: 1.12, transformOrigin: "50% 60%", duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, st.at);
          tl.fromTo("#s3-laser", { opacity: 1, y: -18 }, { opacity: 0, y: 18, duration: 0.3, ease: "power1.inOut", immediateRender: false }, st.at - 0.1);
          tl.fromTo("#s3-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.4, ease: "power1.out", immediateRender: false }, st.at);
          tl.fromTo(st.r, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, st.at + 0.05);
          tl.fromTo(money, { s: st.from[0], t: st.from[1], g: st.from[2] }, { s: st.to[0], t: st.to[1], g: st.to[2], duration: 0.45, ease: "power2.out", onUpdate: paint, immediateRender: false }, st.at + 0.05);
        });
        tl.to("#s3-line-a", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 3.6);
        tl.fromTo("#s3-line-b", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 3.9);
