<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;700;900&display=block" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F7F4EE;font-family:Inter,sans-serif;color:#063F35}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(6,63,53,.10) 2px,transparent 2.5px);background-size:36px 36px}
.disc{position:absolute;left:90px;top:760px;width:900px;height:900px;border-radius:50%;background:#EEF2F1}
.pill{position:absolute;left:80px;top:300px;padding:14px 32px;border-radius:999px;background:#063F35;color:#F7F4EE;font:700 36px/1.2 Inter,sans-serif}
.head{position:absolute;left:80px;top:420px;width:920px;font:900 100px/1.06 Montserrat,sans-serif;letter-spacing:-.02em}
.hot{color:#B4470E}
.hint{position:absolute;left:80px;top:1440px;width:920px;font:700 40px/1.3 Inter,sans-serif;color:#3D5C56}
.logo{position:absolute;left:80px;top:1530px;width:300px}
svg.diyas{position:absolute;left:0;top:1600px;width:1080px;height:200px}
</style>
</head>
<body>
<div class="dots"></div>
<div class="disc"></div>
<div class="pill">Diwali week</div>
<div class="head"><div>Diwali rush mein</div><div>bill kaise</div><div class="hot">banate ho?</div></div>
<div class="hint">Vote karein. Wednesday ko jawab.</div>
<img class="logo" src="assets/khatario-wordmark.png" alt="Khatario" />
<svg class="diyas" viewBox="0 0 1080 200" xmlns="http://www.w3.org/2000/svg">
<g><path d="M640 140 q50 42 100 0 z" fill="#C99A5B"/><ellipse cx="690" cy="112" rx="13" ry="27" fill="#F58220"/></g>
<g><path d="M860 140 q50 42 100 0 z" fill="#C99A5B"/><ellipse cx="910" cy="112" rx="13" ry="27" fill="#F58220"/></g>
</svg>
</body>
</html>
